{% extends 'base.html' %}
{% load static %}
{% block titolo %} Avvisi di chiusura {% endblock titolo %}

{% block contenuto %}

<div class="container">
    <div class="row">
        <div class="col-12 d-flex justify-content-between align-items-center py-5">
            <h1 class="mb-0">Avvisi di chiusura</h1>
            <button type="button" class="btn btn-navbar" data-bs-toggle="modal" data-bs-target="#modalAvviso" id="btnNuovoAvviso">
                Nuovo avviso
            </button>
        </div>
    </div>

    {% include 'partials/tabella_avvisi.html' %}
</div>

<div class="modal fade" id="modalAvviso" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Avviso di chiusura</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Chiudi"></button>
      </div>
      <div class="modal-body" id="modalAvvisoBody">
        {% include 'partials/form_avviso.html' %}
      </div>
    </div>
  </div>
</div>

<script src="{% static 'js/gestione-avvisi.js' %}"></script>

{% endblock contenuto %}
