{% if totale_elementi_carrello > 0 %}
<div id="carrelloFlottante">
  <form id="formCsrfCarrelloFlottante" class="d-none">{% csrf_token %}</form>

  <button type="button" id="bottoneCarrelloFlottante"
    class="btn btn-navbar rounded-circle d-flex align-items-center justify-content-center"
    aria-expanded="false" aria-controls="pannelloCarrelloFlottante"
    title="Preventivo" aria-label="Preventivo">
    <i class="bi bi-file-text-fill fs-4"></i>
    <span id="badgeCarrelloFlottante" class="badge rounded-pill bg-danger">{{ totale_elementi_carrello }}</span>
  </button>

  <div id="pannelloCarrelloFlottante" class="d-none">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h6 class="mb-0">Preventivo</h6>
      <button type="button" id="chiudiCarrelloFlottante" class="btn-close" aria-label="Chiudi"></button>
    </div>

    <ul class="list-unstyled mb-3">
      {% for elemento in elementi_carrello_utente %}
      <li class="d-flex justify-content-between align-items-center mb-2">
        <span class="flex-grow-1 text-truncate me-2">{{ elemento.prodotto.nome_prodotto }}</span>
        <div class="d-flex align-items-center gap-1">
          <button type="button" class="btn btn-sm btn-outline-navbar btn-diminuisci-flottante"
            data-url="{% url 'diminuisci_quantita' elemento.pk %}" aria-label="Diminuisci quantita">
            <i class="bi bi-dash"></i>
          </button>
          <span class="mx-1">{{ elemento.quantita }}</span>
          <button type="button" class="btn btn-sm btn-outline-navbar btn-aumenta-flottante"
            data-url="{% url 'aumenta_quantita' elemento.pk %}" aria-label="Aumenta quantita">
            <i class="bi bi-plus"></i>
          </button>
          <button type="button" class="btn btn-sm btn-link text-danger p-0 border-0 btn-rimuovi-flottante"
            data-url="{% url 'elimina_prodotti' elemento.pk %}" aria-label="Rimuovi">
            <i class="bi bi-trash"></i>
          </button>
        </div>
      </li>
      {% endfor %}
    </ul>

    <a href="{% url 'carrello' %}" class="btn btn-navbar w-100">Checkout preventivo</a>
  </div>
</div>
{% endif %}
