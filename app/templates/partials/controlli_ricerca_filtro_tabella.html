{% comment %}
Filtro sottocategoria di prodotti_tabella.html, nella riga del titolo a destra (stessa tecnica di controlli_ricerca_filtro_card.html).
Dropdown Bootstrap al posto di una <select> nativa; il filtro qui e' client-side (DataTables), via "data-valore" letto dallo script inline che lo passa a "api.column(3).search(...)".
La ricerca non e' in questo partial: viene aggiunta in #controlliRicercaFiltroTabellaWrapper da JS in "initComplete", che sotto i 576px la trasforma in un bottone fluttuante in basso a sinistra.
{% endcomment %}
<div class="filtro-a-comparsa dropdown flex-grow-1 flex-shrink-1" style="max-width: 12rem; min-width: 0;" id="filtroTabellaWrapper">
    <button type="button" id="filtroSottocategoria" class="form-select filtro-a-comparsa-select" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Filtra per sottocategoria"></button>
    <ul class="dropdown-menu dropdown-menu-end filtro-dropdown-menu" aria-labelledby="filtroSottocategoria">
        <li><a class="dropdown-item filtro-dropdown-item active" href="#" data-valore="">Tutte le sottocategorie<span class="pallino-pagina-corrente filtro-item-dot" aria-hidden="true"></span></a></li>
        {% for sc in sottocategorie %}
            <li><a class="dropdown-item filtro-dropdown-item" href="#" data-valore="{{ sc.nome_sottocategoria }}">{{ sc.nome_sottocategoria }}<span class="pallino-pagina-corrente filtro-item-dot" aria-hidden="true"></span></a></li>
        {% endfor %}
    </ul>
    <i class="bi bi-funnel filtro-icon-overlay" aria-hidden="true"></i>
</div>

<div id="controlliRicercaFiltroTabellaWrapper"></div>
