{% load static %}
{% if avviso_fase == 'preavviso' %}
<div class="alert alert-warning alert-dismissible fade show mb-0 rounded-0 text-center" role="alert" id="avvisoChiusura" data-avviso-fase="{{ avviso_fase }}">
    {{ avviso_testo }}
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Chiudi"></button>
</div>
{% elif avviso_fase == 'chiusura' %}
<div class="alert alert-danger alert-dismissible fade show mb-0 rounded-0 text-center" role="alert" id="avvisoChiusura" data-avviso-fase="{{ avviso_fase }}">
    {{ avviso_testo }}
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Chiudi"></button>
</div>
{% endif %}

{% if avviso_fase %}
<script src="{% static 'js/avviso-chiusura.js' %}"></script>
{% endif %}
