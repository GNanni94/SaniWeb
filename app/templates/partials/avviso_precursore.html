{% for message in messages %}
{% if 'precursore-riservato' in message.tags.split %}
<div class="modal fade" id="modalAvvisoPrecursore" tabindex="-1" aria-hidden="true" aria-labelledby="modalAvvisoPrecursoreTitolo">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border: 2px solid var(--color-primary);">
      <div class="modal-header">
        <h5 class="modal-title" id="modalAvvisoPrecursoreTitolo">Attenzione</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Chiudi"></button>
      </div>
      <div class="modal-body">
        {{ message }}
      </div>
    </div>
  </div>
</div>
<script>
(function () {
    var modaleAvvisoPrecursore = document.getElementById('modalAvvisoPrecursore');
    if (!modaleAvvisoPrecursore) {
        return;
    }
    new bootstrap.Modal(modaleAvvisoPrecursore).show();
})();
</script>
{% endif %}
{% endfor %}
