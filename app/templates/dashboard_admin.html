{% extends 'base.html' %}
{% load static %}
{% block titolo %} Dashboard admin {% endblock titolo %}

{% block contenuto %}

<link rel="stylesheet" href="{% static 'css/dashboard-admin.css' %}">

<div class="container">
    <div class="row py-5">
        <div class="col-12">
            <div class="d-flex align-items-center position-relative mb-4">
                <a href="{% url 'home' %}" class="btn btn-navbar btn-sm rounded-pill btn-pillola-intestazione-gestione position-absolute start-0" title="Torna alla home">
                    <i class="bi bi-arrow-left"></i>
                    <span class="d-none d-md-inline">Torna alla home</span>
                </a>
                <h1 class="mb-0 mx-auto">Dashboard admin</h1>
            </div>
        </div>
        <div class="col-12 col-md-6 mb-4">
            <a href="{% url 'gestione_avvisi' %}" class="card text-decoration-none h-100 dashboard-admin-pillola">
                <div class="card-body py-2 ps-4 pe-2 d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Gestione Avvisi</h5>
                    <span class="btn btn-navbar rounded-circle d-flex align-items-center justify-content-center freccia-dashboard-admin" aria-hidden="true">
                        <i class="bi bi-arrow-right"></i>
                    </span>
                </div>
            </a>
        </div>
        <div class="col-12 col-md-6 mb-4">
            <a href="{% url 'dashboard_prodotti_senza_immagine' %}" class="card text-decoration-none h-100 dashboard-admin-pillola">
                <div class="card-body py-2 ps-4 pe-2 d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Prodotti Senza Immagine</h5>
                    <span class="btn btn-navbar rounded-circle d-flex align-items-center justify-content-center freccia-dashboard-admin" aria-hidden="true">
                        <i class="bi bi-arrow-right"></i>
                    </span>
                </div>
            </a>
        </div>
        <div class="col-12 col-md-6 mb-4">
            <a href="{% url 'gestione_documenti' %}" class="card text-decoration-none h-100 dashboard-admin-pillola">
                <div class="card-body py-2 ps-4 pe-2 d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Gestione Sezione Documenti</h5>
                    <span class="btn btn-navbar rounded-circle d-flex align-items-center justify-content-center freccia-dashboard-admin" aria-hidden="true">
                        <i class="bi bi-arrow-right"></i>
                    </span>
                </div>
            </a>
        </div>
    </div>
</div>

{% endblock contenuto %}
